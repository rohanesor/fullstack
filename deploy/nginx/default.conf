server {
  listen 80;
  server_name campusresolve.duckdns.org;
  location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl;
  server_name campusresolve.duckdns.org;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 2m;
  ssl_certificate /etc/letsencrypt/live/campusresolve.duckdns.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/campusresolve.duckdns.org/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
  location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
  location / { try_files $uri $uri/ /index.html; }
}
